name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - master # Support both common branch names

permissions:
  contents: write

# Shared with refresh-feeds.yml so two runs can never push to gh-pages at once.
concurrency:
  group: github-pages-publish
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Install and Build 🔧
        run: |
          cd modern-portfolio
          npm install
          npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Deploy 🚀
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: modern-portfolio/dist
          branch: gh-pages
